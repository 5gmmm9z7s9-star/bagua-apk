name: Build Pygame APK (Native)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps & Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev python3-pip
          pip3 install --user --upgrade buildozer "Cython<0.30"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer android debug
        env:
          BUILDOZER_DISABLE_PPA: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bagua-apk
          path: ./bin/*.apk
