name: Build Kivy APK (Native)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK r25b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev python3-pip automake

      - name: Install buildozer & Cython
        run: |
          pip3 install --user buildozer "Cython<0.30"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rm -rf $HOME/.buildozer

      - name: Pre-download Android SDK + build-tools (Aidl)
        run: |
          buildozer android sdk
          SDK=$HOME/.buildozer/android/platform/android-sdk
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "build-tools;34.0.0" "platforms;android-31"
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1

      - name: Build APK
        run: buildozer android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
          BUILDOZER_DISABLE_PPA: "1"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bagua-apk
          path: ./bin/*.apk
