name: Build Kivy APK (Native)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK r25b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Install system dependencies & Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev python3-pip automake
          pip3 install --user --upgrade buildozer "Cython<0.30"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # 清除旧的buildozer缓存，防止损坏的SDK残留
          rm -rf $HOME/.buildozer

      - name: Build APK
        run: buildozer android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
          BUILDOZER_DISABLE_PPA: "1"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bagua-apk
          path: ./bin/*.apk
